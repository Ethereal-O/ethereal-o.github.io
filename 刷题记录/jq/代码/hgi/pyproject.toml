[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hgi-agent"
version = "0.1.0"
description = "A speculative coding agent that explores while the user is typing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "openai>=2.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "prompt-toolkit>=3.0",
  "structlog>=25.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
hgi = "hgi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hgi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
